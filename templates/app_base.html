{% extends 'base.html' %}

{% block body %}
<div class="app-shell">
  <header class="app-header">
    <a class="brand" href="{% url 'setup' %}">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M12 3v18M8 8v8M4 11v2M16 6v12M20 10v4"/>
        </svg>
      </span>
      <span class="brand-text">Oral Exam Prep</span>
    </a>
    <nav class="app-nav" aria-label="Navigation principale">
      <a
        href="{% url 'setup' %}"
        class="nav-icon{% if request.resolver_match.url_name == 'setup' or request.resolver_match.url_name == 'session' or request.resolver_match.url_name == 'feedback' %} is-active{% endif %}"
        aria-label="Entraînement"
        title="Entraînement"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 10.5 12 3l9 7.5"/>
          <path d="M5.5 9.5V20h13V9.5"/>
          <path d="M9.5 20v-6h5v6"/>
        </svg>
      </a>
      <a
        href="{% url 'account' %}"
        class="nav-icon{% if request.resolver_match.url_name == 'account' %} is-active{% endif %}"
        aria-label="Compte"
        title="Compte"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="8" r="3.5"/>
          <path d="M5 20c.8-3.2 3.4-5 7-5s6.2 1.8 7 5"/>
        </svg>
      </a>
      <form method="post" action="{% url 'logout' %}" class="nav-form">
        {% csrf_token %}
        <button type="submit" class="nav-icon nav-button" aria-label="Se déconnecter" title="Se déconnecter">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14 8V5.5A1.5 1.5 0 0 0 12.5 4h-7A1.5 1.5 0 0 0 4 5.5v13A1.5 1.5 0 0 0 5.5 20h7A1.5 1.5 0 0 0 14 18.5V16"/>
            <path d="M9 12h11"/>
            <path d="m17 8.5 3.5 3.5-3.5 3.5"/>
          </svg>
        </button>
      </form>
    </nav>
  </header>
  <main class="app-main">
    {% if messages %}
      <div class="flash-stack flash-stack-page">
        {% for message in messages %}
          <p class="alert {% if message.tags == 'error' %}alert-error{% else %}alert-success{% endif %}">{{ message }}</p>
        {% endfor %}
      </div>
    {% endif %}
    {% block app_content %}{% endblock %}
  </main>
</div>
{% endblock %}
